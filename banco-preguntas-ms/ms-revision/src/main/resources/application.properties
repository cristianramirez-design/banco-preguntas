server.port=8083
spring.application.name=ms-revision

spring.datasource.url=jdbc:h2:file:./data/ms-revision;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Comunicacion sincrona con ms-usuarios para validar roles (HU-4)
ms.usuarios.url=${MS_USUARIOS_URL:http://localhost:8081}

# Politica de decision (patron Strategy + Factory Method): UNANIMIDAD o MAYORIA
revision.politica=UNANIMIDAD

springdoc.swagger-ui.path=/swagger-ui.html
