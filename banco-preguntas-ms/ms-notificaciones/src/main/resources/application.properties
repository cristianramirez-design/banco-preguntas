server.port=8084
spring.application.name=ms-notificaciones

# Credenciales SMTP (Mailtrap) fuera del repositorio: copie correo.properties.example a correo.properties
spring.config.import=optional:file:./correo.properties,optional:file:../correo.properties
notificaciones.remitente=${NOTIFICACIONES_REMITENTE:banco-preguntas@unicauca.edu.co}

ms.usuarios.url=${MS_USUARIOS_URL:http://localhost:8081}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.default-requeue-rejected=false

springdoc.swagger-ui.path=/swagger-ui.html
