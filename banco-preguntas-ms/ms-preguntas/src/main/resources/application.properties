server.port=8082
spring.application.name=ms-preguntas

# Base de datos propia del microservicio (patron "una base por microservicio").
# Por defecto H2 en archivo; con el perfil "postgres" usa PostgreSQL (ver application-postgres.properties).
spring.datasource.url=jdbc:h2:file:./data/ms-preguntas;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# RabbitMQ (docker compose up -d)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.default-requeue-rejected=false

springdoc.swagger-ui.path=/swagger-ui.html
