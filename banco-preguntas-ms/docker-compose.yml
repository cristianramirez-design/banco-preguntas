# =====================================================================================
#  Banco de Preguntas Saber Pro - Tercer corte (Docker Compose)
#
#  Todo el sistema:          docker compose up -d --build
#  Solo infraestructura      docker compose up -d postgres rabbitmq keycloak
#  (para correr los servicios desde el IDE con iniciar-backend.bat)
#
#  Puertos publicados en el equipo:
#    5173  Frontend (React + Nginx)         http://localhost:5173
#    8080  API Gateway + Swagger            http://localhost:8080/swagger-ui.html
#    8180  Keycloak (consola de admin)      http://localhost:8180   (admin / admin)
#   15672  RabbitMQ (consola)               http://localhost:15672  (guest / guest)
#  Los microservicios NO publican puertos: solo se llega a ellos a traves del gateway.
# =====================================================================================

x-microservicio: &microservicio
  restart: unless-stopped
  mem_limit: 320m
  networks: [banco-red]
  environment: &entorno-comun
    SPRING_PROFILES_ACTIVE: postgres
    DB_HOST: postgres
    RABBITMQ_HOST: rabbitmq
    MS_USUARIOS_URL: http://ms-usuarios:8081

services:
  # ------------------------------ Infraestructura ------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: banco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: banco
      POSTGRES_PASSWORD: banco
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - banco-pgdata:/var/lib/postgresql/data                     # VOLUMEN: datos de las 4 bases
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/01-bases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banco"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    networks: [banco-red]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: banco-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - banco-rabbitdata:/var/lib/rabbitmq                         # VOLUMEN: colas durables
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 30s
    mem_limit: 300m
    networks: [banco-red]

  keycloak:
    image: keycloak/keycloak:25.0.6   # Docker Hub (copia oficial de quay.io)
    container_name: banco-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: banco
      KC_DB_PASSWORD: banco
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx384m"
    ports:
      - "8180:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro              # realm, roles y usuarios de prueba
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 20s
      retries: 30
      start_period: 60s
    mem_limit: 700m
    networks: [banco-red]

  # ------------------------------ Microservicios ------------------------------
  ms-usuarios:
    <<: *microservicio
    build: { context: ., dockerfile: ms-usuarios/Dockerfile }
    image: banco/ms-usuarios:3.0
    container_name: banco-ms-usuarios
    depends_on:
      postgres: { condition: service_healthy }

  ms-preguntas:
    <<: *microservicio
    build: { context: ., dockerfile: ms-preguntas/Dockerfile }
    image: banco/ms-preguntas:3.0
    container_name: banco-ms-preguntas
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  ms-revision:
    <<: *microservicio
    build: { context: ., dockerfile: ms-revision/Dockerfile }
    image: banco/ms-revision:3.0
    container_name: banco-ms-revision
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      ms-usuarios: { condition: service_started }

  ms-notificaciones:
    <<: *microservicio
    build: { context: ., dockerfile: ms-notificaciones/Dockerfile }
    image: banco/ms-notificaciones:3.0
    container_name: banco-ms-notificaciones
    environment:
      <<: *entorno-comun
      SPRING_PROFILES_ACTIVE: default
    # Credenciales de Mailtrap (opcional). Copie correo.env.example a correo.env y llenelo.
    env_file:
      - path: ./ms-notificaciones/correo.env
        required: false
    depends_on:
      rabbitmq: { condition: service_healthy }
      ms-usuarios: { condition: service_started }

  api-gateway:
    <<: *microservicio
    build: { context: ., dockerfile: api-gateway/Dockerfile }
    image: banco/api-gateway:3.0
    container_name: banco-api-gateway
    environment:
      MS_USUARIOS_URL: http://ms-usuarios:8081
      MS_PREGUNTAS_URL: http://ms-preguntas:8082
      MS_REVISION_URL: http://ms-revision:8083
      MS_NOTIFICACIONES_URL: http://ms-notificaciones:8084
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/banco-preguntas/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    depends_on:
      keycloak: { condition: service_healthy }

  # ------------------------------ Frontend ------------------------------
  frontend:
    build: ./frontend
    image: banco/frontend:3.0
    container_name: banco-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on: [api-gateway, keycloak]
    mem_limit: 64m
    networks: [banco-red]

networks:
  banco-red:
    name: banco-red

volumes:
  banco-pgdata:
    name: banco-pgdata
  banco-rabbitdata:
    name: banco-rabbitdata
